<script>
        const sheetID = '1OejhaFCnEhLa8mgkh61QJ7Qk3jNp4PcD2jh96luGbVU';
        // Ubah langsung ke sheet "NTE BARU" sesuai permintaan Anda
        const sheetName = 'NTE BARU';
        
        let allData = [];
        let chartWitelInstance = null;
        let chartTipeInstance = null;

        function showStatus(msg, type = 'info') {
            const el = document.getElementById('status-message');
            el.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-yellow-100', 'text-yellow-700');
            if (type === 'error') el.classList.add('bg-red-100', 'text-red-700');
            else if (type === 'success') el.classList.add('bg-green-100', 'text-green-700');
            else el.classList.add('bg-yellow-100', 'text-yellow-700');
            el.innerText = msg;
        }

        async function loadData() {
            showStatus('Mengambil data khusus sheet NTE BARU...', 'info');
            
            // Mengambil data spesifik dari Sheet "NTE BARU"
            const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
            
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        allData = results.data;
                        initDashboard();
                        showStatus('Data sheet NTE BARU berhasil dimuat!', 'success');
                        setTimeout(() => document.getElementById('status-message').classList.add('hidden'), 3000);
                    } else {
                        showStatus('Gagal memuat data: Sheet NTE BARU kosong atau nama sheet tidak sesuai.', 'error');
                    }
                },
                error: function(err) {
                    showStatus('Gagal terhubung ke Google Sheets. Pastikan akses link bersifat publik.', 'error');
                }
            });
        }

        function initDashboard() {
            populateDropdowns();
            render();
        }

        function populateDropdowns() {
            const witels = [...new Set(allData.map(d => d['WITEL'] || d['DISTRIK'])).filter(Boolean)].sort();
            const merks = [...new Set(allData.map(d => d['MERK'])).filter(Boolean)].sort();

            const selectWitel = document.getElementById('filter-witel');
            selectWitel.innerHTML = '<option value="ALL">Semua Witel / Distrik</option>';
            witels.forEach(w => {
                selectWitel.innerHTML += `<option value="${w}">${w}</option>`;
            });

            const selectMerk = document.getElementById('filter-merk');
            selectMerk.innerHTML = '<option value="ALL">Semua Merk</option>';
            merks.forEach(m => {
                selectMerk.innerHTML += `<option value="${m}">${m}</option>`;
            });

            selectWitel.onchange = render;
            selectMerk.onchange = render;
        }

        function render() {
            const selectedWitel = document.getElementById('filter-witel').value;
            const selectedMerk = document.getElementById('filter-merk').value;

            // Karena file sudah spesifik sheet NTE BARU, tampilkan semua baris yang ada di sheet tersebut
            const filtered = allData.filter(item => {
                const witelVal = item['WITEL'] || item['DISTRIK'] || '';
                const witelMatch = (selectedWitel === 'ALL' || witelVal === selectedWitel);
                const merkMatch = (selectedMerk === 'ALL' || item['MERK'] === selectedMerk);
                return witelMatch && merkMatch;
            });

            let totalStock = 0;
            let dualBand = 0;
            let premium = 0;
            let bigOnt = 0;

            const witelMap = {};
            const tipeMap = {};

            filtered.forEach(item => {
                const qty = parseFloat(item['QTY'] || item['JUMLAH']) || 0;
                const jenis = (item['JENIS'] || item['KATEGORI'] || item['MODEL'] || '').toString().toUpperCase();
                const witel = item['WITEL'] || item['DISTRIK'] || 'UNKNOWN';
                const tipe = item['TYPE'] || item['MERK'] || 'UNKNOWN';

                totalStock += qty;

                if (jenis.includes('DUAL BAND') || jenis.includes('DUALBAND')) dualBand += qty;
                else if (jenis.includes('PREMIUM')) premium += qty;
                else if (jenis.includes('BIG ONT') || jenis.includes('BIGONT')) bigOnt += qty;

                witelMap[witel] = (witelMap[witel] || 0) + qty;
                tipeMap[tipe] = (tipeMap[tipe] || 0) + qty;
            });

            // Update Metric Cards
            document.getElementById('total-stock').innerText = totalStock.toLocaleString('id-ID');
            document.getElementById('total-dualband').innerText = dualBand.toLocaleString('id-ID');
            document.getElementById('total-premium').innerText = premium.toLocaleString('id-ID');
            document.getElementById('total-bigont').innerText = bigOnt.toLocaleString('id-ID');

            // Update Table
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">Tidak ada data di sheet NTE BARU.</td></tr>`;
            } else {
                filtered.slice(0, 100).forEach(item => {
                    const qty = parseFloat(item['QTY'] || item['JUMLAH']) || 0;
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-2 font-medium">${item['WITEL'] || item['DISTRIK'] || '-'}</td>
                            <td class="px-4 py-2"><span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-semibold">NTE BARU</span></td>
                            <td class="px-4 py-2">${item['JENIS'] || item['KATEGORI'] || '-'}</td>
                            <td class="px-4 py-2 font-semibold">${item['MERK'] || '-'}</td>
                            <td class="px-4 py-2">${item['TYPE'] || '-'}</td>
                            <td class="px-4 py-2 text-right font-bold text-blue-700">${qty.toLocaleString('id-ID')}</td>
                        </tr>
                    `;
                });
            }

            renderCharts(witelMap, tipeMap);
        }

        function renderCharts(witelMap, tipeMap) {
            const ctxWitel = document.getElementById('chartWitel').getContext('2d');
            if (chartWitelInstance) chartWitelInstance.destroy();
            chartWitelInstance = new Chart(ctxWitel, {
                type: 'bar',
                data: {
                    labels: Object.keys(witelMap),
                    datasets: [{
                        label: 'Total QTY',
                        data: Object.values(witelMap),
                        backgroundColor: '#3B82F6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            const ctxTipe = document.getElementById('chartTipe').getContext('2d');
            if (chartTipeInstance) chartTipeInstance.destroy();
            
            const sortedTipe = Object.entries(tipeMap).sort((a,b) => b[1] - a[1]).slice(0, 7);

            chartTipeInstance = new Chart(ctxTipe, {
                type: 'doughnut',
                data: {
                    labels: sortedTipe.map(t => t[0]),
                    datasets: [{
                        data: sortedTipe.map(t => t[1]),
                        backgroundColor: ['#10B981', '#6366F1', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#06B6D4']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
